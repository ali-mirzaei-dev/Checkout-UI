<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout UI</title>

    <link rel="stylesheet" href="assets/StyleSheet/output.css">
    <link rel="stylesheet" href="assets/Font/FontSocials/style.css">
    <link rel="stylesheet" href="assets/Font/font1/style.css">

</head>

<body class="min-h-screen bg-[#0D47A1] flex items-center justify-center p-4 md:p-8">

    <div class="w-full max-w-4xl flex flex-col md:flex-row items-center justify-center gap-8 md:gap-12">

        <!--==================#1 CREDIT CARD  ==================-->
        <!--====================================================-->
        <div class="w-75 md:w-100 h-47.5 md:h-62.5 shrink-0 bg-linear-to-br from-[#0D47A1] to-[#2196F3] rounded-2xl shadow-2xl flex flex-col justify-between p-6 md:p-8 text-white relative overflow-hidden transition-all duration-500 hover:scale-[1.02]">
            <div class="absolute -top-10 -right-10 w-40 h-40 bg-white/10 rounded-full"></div>
            <div class="absolute -bottom-10 -left-10 w-32 h-32 bg-black/10 rounded-full"></div>

            <!--==================#1-1 CHIP + CVV2 ==================-->
            <div class="flex justify-between items-center z-10">

                <!--=======#1-1-1 CHIP  =======-->
                <div class="w-12 h-9 md:w-14 md:h-10 rounded-md shadow-inner overflow-hidden relative"
                    style="background: linear-gradient(135deg, #e8e8e8 0%, #b0b0b0 40%, #d0d0d0 70%, #909090 100%);">
                    <div class="absolute inset-0" style="background: repeating-linear-gradient(0deg, transparent, transparent 3px, rgba(80,80,80,0.35) 3px, rgba(80,80,80,0.35) 4px);"></div>
                    <div class="absolute inset-0" style="background: linear-gradient(135deg, rgba(255,255,255,0.5) 0%, transparent 40%, rgba(255,255,255,0.25) 100%);"></div>
                </div>

                <!--=======#1-1-2 CVV2 =======-->
                <div class="flex flex-col items-end">
                    <span class="text-[9px] md:text-[10px] uppercase text-[#E3F2FD]/70 tracking-widest">CVV</span>
                    <span id="creditCVV2" class="font-mono text-base md:text-lg tracking-widest drop-shadow">123</span>
                </div>
            </div>

            <!--==================#1-2 CREDIT CARD NUMBER ==================-->
            <div class="z-10">
                <h1 id="creditNumber" class="font-mono text-lg md:text-2xl tracking-[0.15em] drop-shadow-lg">0000-0000-0000-0000</h1>
            </div>

            <!--==================#1-3 NAME + EXPIRE DATE ==================-->
            <div class="flex justify-between items-end z-10">

                <!--=======#1-3-1 NAME  =======-->
                <div class="flex flex-col">
                    <span class="text-[9px] md:text-[10px] uppercase text-[#E3F2FD]/70 tracking-widest">Card Holder</span>
                    <span id="creaditName" class="font-medium text-sm md:text-lg tracking-wide uppercase">ALI MIRZAEI</span>
                </div>

                <!--=======#1-3-2 EXPIRE DATE  =======-->
                <div class="flex flex-col items-end">
                    <span class="text-[9px] md:text-[10px] uppercase text-[#E3F2FD]/70 tracking-widest">Expires</span>
                    <div class="flex gap-1 items-center font-mono text-sm md:text-lg">
                        <span id="creditDateMonth">11</span>
                        <span>/</span>
                        <span id="creditDateYear">00</span>
                    </div>
                </div>

            </div>
        </div>

        <!--==================#2 PAYMENT FORM ==================-->
        <!--==================================================-->
        <div class="w-75 md:w-100 flex flex-col gap-6 p-6 md:p-8 bg-white rounded-2xl shadow-2xl border border-[#E3F2FD]">
            <h2 class="text-xl md:text-2xl font-bold text-[#0D47A1] text-center">Payment Details</h2>

            <!--==================#2-1 NAME INPUT  ==================-->
            <div class="flex flex-col gap-2">
                <span class="text-xs font-bold uppercase tracking-wider text-[#0D47A1]">Cardholder Name</span>
                <input id="inputName" type="text" placeholder="ENTER YOUR NAME" class="w-full px-4 py-3 rounded-lg border-2 border-[#E3F2FD] bg-[#E3F2FD]/30 text-[#0D47A1] font-medium uppercase tracking-wide focus:outline-none focus:border-[#2196F3] focus:bg-white transition-all duration-300">
            </div>

            <!--==================#2-2 CARD INPUT  ==================-->
            <div class="flex flex-col gap-2">
                <span class="text-xs font-bold uppercase tracking-wider text-[#0D47A1]">Card Number</span>
                <div id="cardNumbersInputParent" class="flex gap-2">
                    <input id="inputCard1" inputmode="numeric" type="text" maxlength="4" placeholder="0000" class="w-full px-2 py-3 text-center rounded-lg border-2 border-[#E3F2FD] bg-[#E3F2FD]/30 text-[#0D47A1] font-mono text-lg tracking-widest focus:outline-none focus:border-[#2196F3] focus:bg-white transition-all duration-300">
                    <input id="inputCard2" inputmode="numeric" type="text" maxlength="4" placeholder="0000" class="w-full px-2 py-3 text-center rounded-lg border-2 border-[#E3F2FD] bg-[#E3F2FD]/30 text-[#0D47A1] font-mono text-lg tracking-widest focus:outline-none focus:border-[#2196F3] focus:bg-white transition-all duration-300">
                    <input id="inputCard3" inputmode="numeric" type="text" maxlength="4" placeholder="0000" class="w-full px-2 py-3 text-center rounded-lg border-2 border-[#E3F2FD] bg-[#E3F2FD]/30 text-[#0D47A1] font-mono text-lg tracking-widest focus:outline-none focus:border-[#2196F3] focus:bg-white transition-all duration-300">
                    <input id="inputCard4" inputmode="numeric" type="text" maxlength="4" placeholder="0000" class="w-full px-2 py-3 text-center rounded-lg border-2 border-[#E3F2FD] bg-[#E3F2FD]/30 text-[#0D47A1] font-mono text-lg tracking-widest focus:outline-none focus:border-[#2196F3] focus:bg-white transition-all duration-300">
                </div>
            </div>

            <!--==================#2-3 EXPIRE DATE + CVV2 INPUT ==================-->
            <div class="flex gap-4">

                <!--=======#2-3-1 EXPIRE DATE INPUT  =======-->
                <div class="flex flex-col gap-2 flex-1">
                    <span class="text-xs font-bold uppercase tracking-wider text-[#0D47A1]">Expires</span>
                    <div class="flex gap-2 items-center">
                        <input id="inputMonth" inputmode="numeric" type="text" maxlength="2" placeholder="MM" class="w-full px-2 py-3 text-center rounded-lg border-2 border-[#E3F2FD] bg-[#E3F2FD]/30 text-[#0D47A1] font-mono text-lg tracking-widest focus:outline-none focus:border-[#2196F3] focus:bg-white transition-all duration-300">
                        <span class="text-[#0D47A1] font-bold text-lg">/</span>
                        <input id="inputYear" inputmode="numeric" type="text" maxlength="2" placeholder="YY" class="w-full px-2 py-3 text-center rounded-lg border-2 border-[#E3F2FD] bg-[#E3F2FD]/30 text-[#0D47A1] font-mono text-lg tracking-widest focus:outline-none focus:border-[#2196F3] focus:bg-white transition-all duration-300">
                    </div>
                </div>

                <!--=======#2-3-2 CVV2 INPUT =======-->
                <div class="flex flex-col gap-2 flex-1">
                    <span class="text-xs font-bold uppercase tracking-wider text-[#0D47A1]">CVV2</span>
                    <input id="inputCVV" inputmode="numeric" type="text" placeholder="123" class="w-full px-4 py-3 text-center rounded-lg border-2 border-[#E3F2FD] bg-[#E3F2FD]/30 text-[#0D47A1] font-mono text-lg tracking-widest focus:outline-none focus:border-[#2196F3] focus:bg-white transition-all duration-300">
                </div>
            </div>

            <!--==================#2-4 CAPTCHA INPUT  ==================-->
            <div class="flex flex-col gap-2">
                <span class="text-xs font-bold uppercase tracking-wider text-[#0D47A1]">Security Verification</span>
                <div class="flex gap-2 items-center">

                    <!--=======#2-4-1 CPATCH TEXT PLACE  =======-->
                    <div id="captchaText" class="select-none w-full px-4 py-3 rounded-lg border-2 border-[#E3F2FD] bg-[#E3F2FD]/40 text-[#0D47A1] font-mono text-lg font-bold tracking-[0.3em] text-center italic line-through opacity-80" style="text-decoration: line-through; text-decoration-style: wavy; text-decoration-color: rgba(13, 71, 161, 0.3);">
                    </div>

                    <!--=======#2-4-2 CAPTCHA REFRESH BTN  =======-->
                    <button id="refreshCaptcha" type="button" title="Refresh Captcha" class="flex items-center justify-center shrink-0 p-3 rounded-lg border-2 border-[#E3F2FD] bg-[#E3F2FD]/30 text-[#0D47A1] hover:bg-[#90CAF9]/40 hover:border-[#2196F3] transition-all duration-300 cursor-pointer active:scale-90">
                        <i class="icon text-xl"></i>
                    </button>
                </div>

                <!--=======#2-4-3 CAPTCHA INPUT =======-->
                <input id="inputCaptcha" type="text" placeholder="Enter the code above" class="w-full px-4 py-3 rounded-lg border-2 border-[#E3F2FD] bg-[#E3F2FD]/30 text-[#0D47A1] font-mono text-lg tracking-widest focus:outline-none focus:border-[#2196F3] focus:bg-white transition-all duration-300">

                <span class="text-[10px] text-[#0D47A1]/50 uppercase tracking-wider">Type the characters you see above</span>
            </div>

            <!-- Submit Button -->
            <button id="submitPayment" class="w-full py-3.5 bg-linear-to-r from-[#2196F3] to-[#0D47A1] text-white font-bold uppercase tracking-wider rounded-lg shadow-lg hover:shadow-xl hover:scale-[1.02] transition-all duration-300 cursor-pointer active:scale-95">
                Pay Now
            </button>
        </div>
    </div>
</body>

<script src="assets/JavaScript/main.js"></script>

</html>
